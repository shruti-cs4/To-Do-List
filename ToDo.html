<!DOCTYPE html>
<html>
  <title>
    To Do list
  </title>
  <link rel="stylesheet" href="style.css"
  <body>
    <p class="heading">Todo List</p>
    <input placeholder="Todo name" class="todo"> 
    <input type="date" class="date">
    <button class="add-button" onclick="add()">
      Add
    </button>

    
    <div class="text"></div>
    <script>   
      const todoList = [];
     
      function add(){
        const work = document.querySelector('.todo').value;
        const date = document.querySelector('.date').value;
        const todo = [work, date]
        todoList.push(todo);
        addingList();
        console.log()
        
      };
      
      function addingList(){
        let htmlTodoList = ``;
        for (let i = 0; i < todoList.length; i++){
          const html = `
            <p>${todoList[i][0]} ${todoList[i][1]}
                <button class = delete-button onclick="deleteItem(${i})">
                  Delete
                </button>
            </p>`;
          htmlTodoList += html;
        }
        document.querySelector('.text').innerHTML = htmlTodoList;  
      };

      function deleteItem(i){
        todoList.splice(i, 1);
        addingList();
      }
      
    </script>
    
  </body>
</html>
